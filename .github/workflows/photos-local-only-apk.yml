name: "Build (Photos Local-Only APK)"

on:
    push:
        paths:
            - "mobile/**"
            - "rust/**"
            - ".github/workflows/photos-local-only-apk.yml"
            - ".github/actions/setup-flutter/action.yml"
    pull_request:
        paths:
            - "mobile/**"
            - "rust/**"
            - ".github/workflows/photos-local-only-apk.yml"
            - ".github/actions/setup-flutter/action.yml"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: photos-local-only-apk-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-local-only-apk:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: mobile/apps/photos

        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup JDK 17
              uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
              with:
                  distribution: "temurin"
                  java-version: "17"

            - name: Install Flutter
              uses: ./.github/actions/setup-flutter

            - run: flutter pub get --enforce-lockfile

            - name: Generate Rust bindings
              run: cargo codegen frb photos
              working-directory: rust

            - name: Create temporary APK signing key
              id: signing_key
              run: |
                  signing_password="$(openssl rand -hex 24)"
                  keytool -genkeypair -noprompt \
                      -keystore "$RUNNER_TEMP/local-only-test.jks" \
                      -storepass "$signing_password" \
                      -keypass "$signing_password" \
                      -alias local-only \
                      -dname "CN=Ente Photos Local-Only CI" \
                      -keyalg RSA \
                      -keysize 2048 \
                      -validity 1
                  echo "password=$signing_password" >> "$GITHUB_OUTPUT"

            - name: Build local-only release APK
              run: flutter build apk --release --flavor localOnly --target-platform android-arm,android-arm64 --dart-define=cronetHttpNoPlay=true
              env:
                  SIGNING_KEY_PATH: ${{ runner.temp }}/local-only-test.jks
                  SIGNING_KEY_ALIAS: local-only
                  SIGNING_KEY_PASSWORD: ${{ steps.signing_key.outputs.password }}
                  SIGNING_STORE_PASSWORD: ${{ steps.signing_key.outputs.password }}

            - name: Upload local-only release APK
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: ente-photos-local-only-release-apk
                  path: mobile/apps/photos/build/app/outputs/flutter-apk/app-localOnly-release.apk
                  if-no-files-found: error
                  retention-days: 7
