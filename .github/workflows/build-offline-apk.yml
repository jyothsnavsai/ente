name: Build Custom Ente Photos APK

on:
  workflow_dispatch:
  push:
    branches:
      - feat/offline-local-albums-and-people

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies & generate code
        working-directory: mobile/apps/photos
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs || true

      - name: Build Release APK (Independent / F-Droid flavor)
        working-directory: mobile/apps/photos
        run: |
          flutter build apk --release --flavor independent --no-tree-shake-icons

      - name: Upload Compiled APK for Download
        uses: actions/upload-artifact@v4
        with:
          name: ente-photos-offline-apk
          path: mobile/apps/photos/build/app/outputs/flutter-apk/*.apk
